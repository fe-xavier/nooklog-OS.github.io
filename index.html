<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f5f0e8">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="media/AC_froggychair.png">
  <title>NookPhone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Quicksand', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeInUpSlow {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up-slow {
      animation: fadeInUpSlow 0.32s ease-out forwards;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeInUpSlow 0.22s ease-out; }

    input, select, textarea { user-select: text; }
  </style>
</head>
<body class="bg-[#e4decb] min-h-screen flex items-center justify-center p-0 sm:p-4 overflow-hidden">

  <!-- CHASSI DO NOOKPHONE (Exatamente como no exemplo enviado) -->
  <div class="relative bg-[#f5f0e8] w-full h-screen sm:h-[620px] sm:w-[356px] sm:rounded-[4rem] shadow-2xl border-0 sm:border-8 border-[#e8d4b0] flex flex-col transition-all duration-500 ease-out translate-y-0 overflow-hidden">

    <!-- BARRA DE STATUS SUPERIOR -->
    <div class="relative flex items-center justify-center pt-5 px-4 pb-2 border-b border-[#e0daca]">
      <!-- Status Celular (Esquerda) -->
      <div class="absolute left-7 flex items-center gap-1" id="cellularStatus" title="Status da Rede">
        <svg width="46" height="12" viewBox="0 0 46 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect id="bar1" x="1" y="7" width="3.5" height="4" rx="1" fill="#e0daca"/>
          <rect id="bar2" x="6" y="5" width="3.5" height="6" rx="1" fill="#e0daca"/>
          <rect id="bar3" x="11" y="3" width="3.5" height="8" rx="1" fill="#e0daca"/>
          <rect id="bar4" x="16" y="1" width="3.5" height="10" rx="1" fill="#e0daca"/>
          <circle id="netDot" cx="27" cy="6" r="3.5" fill="#e0daca"/>
        </svg>
      </div>

      <!-- Relógio e Data Central -->
      <div class="text-center cursor-pointer" onclick="goHome()">
        <div class="flex items-center justify-center gap-1 leading-none">
          <span id="clockTime" class="text-lg font-bold text-[#c7beaa]">9:17</span>
          <span id="clockAmPm" class="text-xs font-bold text-[#c7beaa]">PM</span>
        </div>
        <div id="clockDate" class="text-[11px] font-bold text-[#c7beaa] tracking-wide mt-0.5">SATURDAY, NOV. 7</div>
      </div>

      <!-- Status Localização / Som (Direita) -->
      <button class="absolute right-7 flex items-center gap-1" onclick="toggleMute()" title="Alternar Som">
        <svg id="locSvg" width="25" height="15" viewBox="0 0 25 15" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 1C9.46 1 7 3.46 7 6.5C7 10.62 12.5 14 12.5 14C12.5 14 18 10.62 18 6.5C18 3.46 15.54 1 12.5 1ZM12.5 8.5C11.4 8.5 10.5 7.6 10.5 6.5C10.5 5.4 11.4 4.5 12.5 4.5C13.6 4.5 14.5 5.4 14.5 6.5C14.5 7.6 13.6 8.5 12.5 8.5Z" fill="#c7beaa"/>
        </svg>
      </button>
    </div>

    <!-- BALÃO DE AVISO RÁPIDO (TOAST) -->
    <div id="nookToast" class="pointer-events-none opacity-0 transition-all duration-300 absolute top-16 left-1/2 -translate-x-1/2 z-50 bg-[#4a443b] text-[#f5f0e8] px-4 py-1.5 rounded-full shadow-lg flex items-center gap-2 text-xs font-bold whitespace-nowrap border-2 border-[#e8d4b0]">
      <img id="toastIcon" src="media/AC_froggychair.png" class="w-4 h-4 rounded-md object-contain" alt="">
      <span id="toastText">Salvo!</span>
    </div>

    <!-- CORPO PRINCIPAL ROLÁVEL -->
    <div class="flex-1 overflow-y-auto hide-scrollbar">

      <!-- ========================================== -->
      <!-- TELA 0: GRADE 3x3 DO NOOKPHONE             -->
      <!-- ========================================== -->
      <section id="screen-home" class="screen active">
        <div class="flex-1 flex flex-col justify-start px-6 py-[18px]">
          <div class="grid grid-cols-3 gap-x-6 gap-y-5 w-full">

            <!-- 1. Timer / Ponto -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-time', 'Timer')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 relative w-full">
                <img alt="Timer" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_clock.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Timer</span>
              </button>
            </div>

            <!-- 2. Escala A3 / Calculadora -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-scale', 'Escala A3')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <img alt="Escala A3" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_calculator.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Escala A3</span>
              </button>
            </div>

            <!-- 3. Calendário / Métricas -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-stats', 'Métricas')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <img alt="Calendário" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_calendar.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Métricas</span>
              </button>
            </div>

            <!-- 4. Câmera / Diário -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-diary', 'Câmera')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <img alt="Câmera" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_camera.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Diário</span>
              </button>
            </div>

            <!-- 5. Acervo VPS -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-archive', 'Acervo VPS')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <img alt="Acervo" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_gallery.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Acervo</span>
              </button>
            </div>

            <!-- 6. Fila de Postagens -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-sync', 'Fila & VPS')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <div class="relative">
                  <img alt="Postagens" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_post.png">
                  <span id="badgeQueue" class="hidden absolute -top-1 -right-1 bg-[#ee7b6d] text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center shadow">0</span>
                </div>
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Fila VPS</span>
              </button>
            </div>

            <!-- 7. The Roost (Pausa/Bem-estar) -->
            <div class="animate-fade-in-up-slow">
              <button onclick="quickWellbeingStamp()" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <img alt="The Roost" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_roost.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">The Roost</span>
              </button>
            </div>

            <!-- 8. Recordes & Streaks -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-records', 'Recordes')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <img alt="Recordes" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_health.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Streaks</span>
              </button>
            </div>

            <!-- 9. Ajustes -->
            <div class="animate-fade-in-up-slow">
              <button onclick="openApp('screen-sync', 'Ajustes')" class="flex flex-col items-center gap-1.5 transition-all hover:scale-105 active:scale-95 w-full">
                <img alt="Ajustes" width="80" height="80" class="rounded-3xl shadow-md w-[76px] h-[76px] object-cover" src="media/AC_settings.png">
                <span class="text-xs font-semibold text-center leading-tight text-[#3d3d3d]">Ajustes</span>
              </button>
            </div>

          </div>
        </div>
      </section>

      <!-- ========================================== -->
      <!-- TELA 1: TIMER & MINUTOS (MÚLTIPLOS DE 5)   -->
      <!-- ========================================== -->
      <section id="screen-time" class="screen px-5 py-3">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <img src="media/AC_clock.png" class="w-7 h-7 rounded-xl shadow-sm" alt="">
            <h2 class="text-sm font-bold text-[#3d3d3d]">Registro de Tempo</h2>
          </div>
          <button onclick="goHome()" class="text-xs font-bold text-[#8c7b6b] bg-[#e8e0d0] px-3 py-1 rounded-full">Voltar</button>
        </div>

        <div class="bg-[#fffdf9] rounded-3xl p-3.5 shadow-sm border border-[#e0daca] mb-3">
          <div class="grid grid-cols-2 gap-2 mb-2.5">
            <div>
              <label class="text-[10px] font-bold text-[#8c7b6b] uppercase">Data</label>
              <input type="date" id="timeDate" class="w-full text-xs font-bold bg-[#f5f0e8] border border-[#e0daca] rounded-xl px-2.5 py-1.5 text-[#3d3d3d]">
            </div>
            <div>
              <label class="text-[10px] font-bold text-[#8c7b6b] uppercase">Categoria</label>
              <select id="timeCategory" onchange="playNookSound('select')" class="w-full text-xs font-bold bg-[#f5f0e8] border border-[#e0daca] rounded-xl px-2 py-1.5 text-[#3d3d3d]">
                <option value="Acadêmico">📚 Acadêmico</option>
                <option value="Pesquisa">🔬 Pesquisa</option>
                <option value="Trabalho">🛠️ Trabalho</option>
                <option value="Bem-estar">🧘‍♀️ Bem-estar</option>
              </select>
            </div>
          </div>

          <div class="bg-[#f5f0e8] rounded-2xl p-3 text-center border border-[#e0daca]">
            <div id="timerDisplay" class="text-3xl font-bold text-[#3d3d3d] tracking-wider mb-2">00:00:00</div>
            <button id="btnToggleTimer" onclick="toggleTimer()" class="w-full bg-[#88d4ab] text-[#2d4739] font-bold text-xs py-2.5 rounded-2xl shadow-sm active:scale-95 transition-transform">
              ▶ Iniciar Timer
            </button>
          </div>
        </div>

        <div class="bg-[#fffdf9] rounded-3xl p-3.5 shadow-sm border border-[#e0daca]">
          <div class="text-xs font-bold text-[#3d3d3d] mb-2">Adicionar Horas/Minutos</div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] font-bold text-[#8c7b6b]">HORAS</label>
              <input type="number" id="manualHours" placeholder="0" min="0" oninput="previewRounding()" class="w-full text-xs font-bold bg-[#f5f0e8] border border-[#e0daca] rounded-xl px-2.5 py-1.5">
            </div>
            <div>
              <label class="text-[10px] font-bold text-[#8c7b6b
